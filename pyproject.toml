[project]
name = "mojo-jiwer"
version = "0.1.0"
description = "Jiwer-compatible WER and CER computation backed by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "jiwer", "speech-recognition", "wer", "cer"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "jiwer"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
